  <!-- registers window.__CAMPAIGN (sponsored campaigns); level.js calls it guarded -->
  <script src="campaign.js?v=1788358066"></script>
  <script src="level.js?v=1788358066"></script>
<!-- SELF-HEAL. index.html is served cache-control: max-age=600, so for ten
     minutes after a deploy a returning visitor holds the previous index, which
     carries the previous ?v= stamps and therefore loads the previous JS as a
     matched stale set. The ?v= stamps cannot fix that, because the stale index
     is what selects them. This compares the build this page was built with
     against build.txt fetched with no-store, and if they differ reloads once
     through a URL the browser has never cached. sessionStorage stops it
     looping if build.txt is ever wrong. -->
<script>
(function () {
  try {
    var tag = document.querySelector('script[src*="auction.js"]');
    var mine = tag && (tag.getAttribute("src").match(/[?&]v=(\d+)/) || [])[1];
    if (!mine) return;                       // unstamped build, nothing to compare
    fetch("build.txt", { cache: "no-store" }).then(function (r) { return r.text(); })
      .then(function (t) {
        var live = String(t).trim();
        if (!/^\d+$/.test(live) || live === mine) return;
        if (sessionStorage.getItem("fb.reloadedFor") === live) return;
        sessionStorage.setItem("fb.reloadedFor", live);
        location.replace(location.pathname + "?b=" + live + location.hash);
      }).catch(function () {});
  } catch (e) {}
})();
</script>
